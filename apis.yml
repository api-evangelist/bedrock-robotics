aid: bedrock-robotics
name: Bedrock Robotics
description: 'Bedrock Robotics develops advanced autonomy for the built world, retrofitting
  existing heavy construction machinery with an autonomous kit the company calls the Bedrock
  Operator. The system adds machine intelligence to equipment such as excavators and dozers
  so jobsites can run around the clock with reduced human intervention, compressing project
  timelines, improving safety by removing operators from hazardous work, and enabling remote
  progress tracking. Backed by 8vc and Emergence Capital, the company raised a $270M Series B.
  Bedrock is a robotics and physical-autonomy company; it publishes no public developer API,
  documentation, or SDK surface at this time. This profile tracks the company in the API
  Evangelist network and captures its public web and security posture.'
